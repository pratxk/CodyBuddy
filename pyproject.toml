[project]
name = "codybuddy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=4",
    "cryptography>=48.0.0",
    "email-validator>=2",
    "google-auth>=2.37",
    "groq>=0.31.0",
    "httpx>=0.28.1",
    "langchain>=0.3.27",
    "langchain-core>=0.3.72",
    "langchain-google-genai>=4.2.2",
    "langchain-groq>=0.3.7",
    "langchain-nvidia-ai-endpoints>=1.3.0",
    "langchain-openai>=1.2.1",
    "langgraph>=0.6.3",
    "openai>=1.59.6",
    "pip>=25.2",
    "psycopg2-binary>=2.9",
    "pydantic>=2.11.7",
    "pyjwt>=2.10",
    "python-dotenv>=1.1.1",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "fastapi>=0.115.6",
    "uvicorn>=0.34.0",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "real_auth: use real auth dependency (no get_current_user override)",
]
